<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&#x7ebf;&#x4e0b;&#x57f9;&#x8bad;&#x73b0;&#x573a; | &#x826f;&#x58e4;</title>
  <style>
    :root {
      --bg: #080909;
      --green: #62bd43;
      --text: #f5f5f0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1180px; background: #080909; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .wide { width: min(2200px, calc(100vw - 80px)); margin: 0 auto; }
    .siteHeader { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.92); border-bottom: 1px solid rgba(255,255,255,.08); }
    .headerInner { height: 72px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 13px; color: #fff; font-size: 18px; font-weight: 700; white-space: nowrap; }
    .brand img { width: 44px; height: 44px; object-fit: contain; filter: grayscale(1) invert(1) brightness(2.6) contrast(1.25); }
    .brandLine { width: 1px; height: 29px; background: rgba(255,255,255,.7); }
    .back { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 20px; border-radius: 999px; background: var(--green); color: #101010; font-size: 15px; font-weight: 800; }
    main { padding: 86px 0 110px; }
    .pageHead { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin-bottom: 54px; }
    .pageHead p { margin: 0 0 8px; color: rgba(255,255,255,.88); font-size: 19px; }
    .pageHead h1 { margin: 0; color: var(--green); font-size: 48px; line-height: 1.05; }
    .pageHead span { display: block; max-width: 620px; color: rgba(255,255,255,.72); font-size: 18px; line-height: 1.8; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    .photo { margin: 0; overflow: hidden; border-radius: 10px; background: #151515; aspect-ratio: 3 / 2; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform .35s ease, filter .35s ease; }
    .photo:hover img { transform: scale(1.04); filter: brightness(1.06); }
    @media (max-width: 1180px) {
      body { min-width: 0; }
      .wide { width: min(100% - 32px, 960px); }
      .pageHead { display: grid; align-items: start; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .pageHead h1 { font-size: 38px; }
    }
    @media (max-width: 640px) {
      .brand span:last-child { display: none; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="siteHeader">
    <div class="wide headerInner">
      <a class="brand" href="./index.html#home" aria-label="Back to home">
        <img src="./assets/site/logo.png" alt="Liangrang" />
        <span class="brandLine"></span>
        <span>&#x8ba9;&#x7ed3;&#x679c;&#x751f;&#x957f;&#x7684;&#x5730;&#x65b9;</span>
      </a>
      <a class="back" href="./index.html#training">&#x8fd4;&#x56de;&#x9996;&#x9875;</a>
    </div>
  </header>
  <main>
    <div class="wide">
      <div class="pageHead">
        <div>
          <p>Offline training site</p>
          <h1>&#x7ebf;&#x4e0b;&#x57f9;&#x8bad;&#x73b0;&#x573a;</h1>
        </div>
        <span>&#x7cbe;&#x9009;&#x7ebf;&#x4e0b;&#x57f9;&#x8bad;&#x3001;&#x8bfe;&#x7a0b;&#x5b9e;&#x6218;&#x3001;&#x5b66;&#x5458;&#x4e92;&#x52a8;&#x4e0e;&#x73b0;&#x573a;&#x4ea4;&#x4ed8;&#x753b;&#x9762;&#xff0c;&#x5448;&#x73b0;&#x826f;&#x58e4;&#x5728;&#x771f;&#x5b9e;&#x573a;&#x666f;&#x4e2d;&#x7684;&#x5185;&#x5bb9;&#x8868;&#x8fbe;&#x4e0e;&#x5546;&#x4e1a;&#x8f6c;&#x5316;&#x8bad;&#x7ec3;&#x3002;</span>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </main>
  <script>
    const asset = './assets/site/';
    const altPrefix = '\u7ebf\u4e0b\u57f9\u8bad\u73b0\u573a ';
    const trainings = [
      'training-new-05.jpg', 'training-extra-12.jpg', 'training-new-12.jpg', 'training-extra-03.jpg', 'training-new-02.jpg',
      'training-extra-18.jpg', 'training-new-16.jpg', 'training-extra-07.jpg', 'training-new-09.jpg', 'training-extra-21.jpg',
      'training-new-14.jpg', 'training-extra-01.jpg', 'training-new-03.jpg', 'training-extra-15.jpg', 'training-new-18.jpg',
      'training-extra-09.jpg', 'training-new-07.jpg', 'training-extra-22.jpg', 'training-new-11.jpg', 'training-extra-05.jpg',
      'training-new-01.jpg', 'training-extra-14.jpg', 'training-new-15.jpg', 'training-extra-02.jpg', 'training-new-08.jpg',
      'training-extra-20.jpg', 'training-new-19.jpg', 'training-extra-10.jpg', 'training-new-04.jpg', 'training-extra-16.jpg',
      'training-new-13.jpg', 'training-extra-06.jpg', 'training-new-06.jpg', 'training-extra-19.jpg', 'training-new-17.jpg',
      'training-extra-11.jpg', 'training-new-10.jpg', 'training-extra-04.jpg', 'training-extra-13.jpg', 'training-extra-08.jpg'
    ];
    const gallery = document.getElementById('gallery');
    trainings.forEach((name, index) => {
      const figure = document.createElement('figure');
      figure.className = 'photo';
      const img = document.createElement('img');
      img.src = asset + name;
      img.alt = altPrefix + (index + 1);
      img.loading = 'lazy';
      img.decoding = 'async';
      figure.appendChild(img);
      gallery.appendChild(figure);
    });
  </script>
</body>
</html>
